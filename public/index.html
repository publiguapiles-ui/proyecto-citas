<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller - Citas de Servicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pagina">
    <header class="encabezado">
      <img src="img/logo-taller.png" alt="Taller - Mecánica Automotriz" class="logo" />
      <p class="subtitulo">Sistema de Citas</p>
    </header>

    <main class="contenedor">
      <section class="tarjeta">
        <h2>Solicitar una cita</h2>
        <form id="form-crear">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="contacto">Contacto (email o teléfono)</label>
          <input type="text" id="contacto" name="contacto" required />

          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required />

          <label for="hora">Hora</label>
          <input type="time" id="hora" name="hora" required />

          <button type="submit">Solicitar cita</button>
        </form>
        <div id="crear-resultado" class="resultado"></div>
      </section>

      <section class="tarjeta">
        <h2>Consultar estado de una solicitud</h2>
        <form id="form-consultar">
          <label for="codigo">Código de seguimiento</label>
          <input type="text" id="codigo" name="codigo" placeholder="SOL-XXXXXX" required />

          <button type="submit">Consultar</button>
        </form>
        <div id="consultar-resultado" class="resultado"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

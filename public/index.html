<body>
  <div class="pagina">
    <header class="encabezado">
      <img src="img/logo-taller.png" alt="Taller Mecánica Automotriz Madrigal" class="logo" />
      <p class="subtitulo">Sistema de Citas</p>

      <div class="redes">

          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.16 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.78 8.44-4.94 8.44-9.94Z"/>
          </svg>
        </a>
        <a href="#" aria-label="Instagram" title="Instagram (próximamente)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.76 1.15.5.5.9 1.1 1.15 1.76.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.76 4.9 4.9 0 0 1-1.76 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.76-1.15 4.9 4.9 0 0 1-1.15-1.76c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.76.5-.5 1.1-.9 1.76-1.15.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.28 2 12 2Zm0 1.8c-2.67 0-2.99.01-4.04.06-.87.04-1.34.18-1.65.3-.42.16-.71.36-1.02.67-.31.31-.51.6-.67 1.02-.12.31-.26.78-.3 1.65C4.27 8.55 4.26 8.87 4.26 10.5v3c0 1.63.01 1.95.06 3 .04.87.18 1.34.3 1.65.16.42.36.71.67 1.02.31.31.6.51 1.02.67.31.12.78.26 1.65.3 1.05.05 1.37.06 4.04.06s2.99-.01 4.04-.06c.87-.04 1.34-.18 1.65-.3.42-.16.71-.36 1.02-.67.31-.31.51-.6.67-1.02.12-.31.26-.78.3-1.65.05-1.05.06-1.37.06-3v-3c0-1.63-.01-1.95-.06-3-.04-.87-.18-1.34-.3-1.65a2.7 2.7 0 0 0-.67-1.02 2.7 2.7 0 0 0-1.02-.67c-.31-.12-.78-.26-1.65-.3C14.99 3.81 14.67 3.8 12 3.8Zm0 3.05a5.15 5.15 0 1 1 0 10.3 5.15 5.15 0 0 1 0-10.3Zm0 1.8a3.35 3.35 0 1 0 0 6.7 3.35 3.35 0 0 0 0-6.7Zm5.35-1.99a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0Z"/>
          </svg>
        </a>
      </div>
    </header>

    <main class="contenedor">
      <section class="tarjeta">
        <h2>
          <svg class="icono-titulo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
            <path d="M9 15l2 2 4-4" />
          </svg>
          Solicitar una cita
        </h2>
        <form id="form-crear">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="contacto">Contacto (email o teléfono)</label>
          <input type="text" id="contacto" name="contacto" required />

          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required />
          <div id="clima-info" class="clima-info"></div>

          <label for="hora">Hora</label>
          <input type="time" id="hora" name="hora" required />

          <button type="submit">Solicitar cita</button>
        </form>
        <div id="crear-resultado" class="resultado"></div>
      </section>

      <section class="tarjeta">
        <h2>
          <svg class="icono-titulo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          Consultar estado de una solicitud
        </h2>
        <form id="form-consultar">
          <label for="codigo">Código de seguimiento</label>
          <input type="text" id="codigo" name="codigo" placeholder="SOL-XXXXXX" required />

          <button type="submit">Consultar</button>
        </form>
        <div id="consultar-resultado" class="resultado"></div>
      </section>

      <section class="tarjeta marcas">
        <h2>Marcas que atendemos</h2>
        <div class="marcas-lista">
          <span class="marca-chip">Toyota</span>
          <span class="marca-chip">Hyundai</span>
          <span class="marca-chip">Nissan</span>
          <span class="marca-chip">Kia</span>
          <span class="marca-chip">Chevrolet</span>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
